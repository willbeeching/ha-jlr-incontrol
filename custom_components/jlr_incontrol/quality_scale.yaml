# An honest assessment against Home Assistant's integration quality scale.
#
# This is a custom integration, so nothing here is enforced by hassfest. It is
# kept because writing down what is not done is the only way the list stops
# growing quietly — every "todo" below was found by someone reading the code,
# not by a check.
#
# Rule names are taken from script/hassfest/quality_scale.py in home-assistant
# /core, not invented.

rules:
  # ------------------------------------------------------------------ bronze
  action-setup:
    status: exempt
    comment: >-
      No actions are registered. Remote commands were removed when Jaguar Land
      Rover put device attestation over the endpoints that performed them.
  appropriate-polling: done
  brands:
    status: done
    comment: >-
      Icon and logo, light and dark, at 1x and 2x, in brand/. The exemption
      here used to say a custom integration cannot provide compliant branding;
      that stopped being true when local brand assets became supported, and
      HACS validation now runs the check rather than ignoring it.
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency:
    status: done
    comment: No third-party requirements at all; only what Home Assistant ships.
  docs-actions:
    status: exempt
    comment: No actions.
  docs-conditions:
    status: exempt
    comment: No conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: No triggers.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # ------------------------------------------------------------------ silver
  action-exceptions:
    status: done
    comment: >-
      The refresh button is a platform action, and pressing it when Jaguar
      Land Rover are not answering now raises a translated HomeAssistantError
      rather than returning quietly. Previously exempt on the grounds that
      there are no actions, which read the rule too narrowly.
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable:
    status: done
    comment: >-
      Status entities go unavailable once the Data Hub link can no longer vouch
      for them: three hours without a good read and no stream connected, or a
      link JLR have revoked. Location and the refresh button do not depend on
      the latest read and stay available; location's own honesty signal is the
      trusted attribute, about the age of the fix.
  integration-owner: done
  log-when-unavailable:
    status: done
    comment: >-
      Once on the way down and once on the way back, at info, for the Data
      Hub's reads and its stream separately, with the retries in between at
      debug. The 3.0.0-beta.1 link logged every failed read and reconnect at
      warning, up to four lines an hour each for as long as an outage lasted;
      the InControl socket had been put right the same way before it was
      removed.
  parallel-updates: done
  reauthentication-flow:
    status: done
    comment: >-
      A Data Hub link JLR stop accepting starts a reauth, which runs the same
      steps as the first link on the same entry and keeps every entity. Found
      at startup it fails setup as auth failed rather than not ready, so a
      refresh token JLR have refused is not tried again on every retry. A
      client from a different JLR account is refused, since its cars are not
      this entry's. Until 3.0.0-beta.2 this was a repair that could only
      describe the steps.
  test-coverage:
    status: done
    comment: >-
      99% of the package, and every module at or above the 95% this rule asks
      for — checked per module in CI, not just as an average, because the
      average is the number that hides one module rotting. Run against both
      the oldest supported core and the newest. The config flow is at 98%.

      What is left uncovered is the handful of branches that need a real JLR
      server to reach — a 403 from an edge appliance mid-request, an endpoint
      answering 200 with a body nobody has seen — and each is a log line rather
      than a decision.

  # -------------------------------------------------------------------- gold
  devices: done
  diagnostics: done
  discovery:
    status: exempt
    comment: A cloud account; there is nothing on the network to discover.
  discovery-update-info:
    status: exempt
    comment: As above.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices: done
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default:
    status: done
    comment: >-
      The 12V state of charge, the EVCC connector letter and the charge-now
      override are off by default. All three are either noisy or written for
      one specific consumer, and none is what someone opens the integration
      to look at.
  entity-translations: done
  exception-translations:
    status: done
    comment: >-
      Every failure a person can act on carries a translation key: a refresh
      that read nothing, a refresh pressed again inside the minute, setup
      finding no status for any car, setup held back while a car's EV
      readings are failing, and setup finding the link refused.
  icon-translations: done
  reconfiguration-flow:
    status: todo
    comment: >-
      Was done for the InControl sign-in, which 3.0.0 removed. Linking the Data
      Hub again, to a new client or certificate, lives in the options menu
      rather than in a reconfigure flow.
  repair-issues:
    status: done
    comment: >-
      Each condition that needs a person, other than a refused link (a
      reauth), is a repair naming what to do and where: an entry from the
      InControl sign-in waiting for the Data Hub, a certificate within 30 days
      of running out,
      the stream switched off, and a car whose status or location JLR refuse.
      None is fixable from Home Assistant alone, because the fix is at
      data.jlr.com or is the options' linking steps, so each says how and
      goes away by itself once the condition clears.
  stale-devices: done

  # ---------------------------------------------------------------- platinum
  async-dependency:
    status: done
    comment: Fully async; aiohttp throughout, no blocking client.
  inject-websession:
    status: done
    comment: >-
      The Data Hub client takes Home Assistant's shared session. The stream is
      MQTT over its own TLS socket, which aiohttp has no part in.
  strict-typing:
    status: done
    comment: >-
      Every setting mypy's --strict turns on is spelled out in pyproject.toml
      rather than inherited from the flag, so switching one off later has to be
      a deliberate and visible decision. CI runs it against a real core with no
      --ignore-missing-imports, which is what makes it mean anything.
