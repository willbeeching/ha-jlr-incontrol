# An honest assessment against Home Assistant's integration quality scale.
#
# This is a custom integration, so nothing here is enforced by hassfest. It is
# kept because writing down what is not done is the only way the list stops
# growing quietly — every "todo" below was found by someone reading the code,
# not by a check.
#
# Rule names are taken from script/hassfest/quality_scale.py in home-assistant
# /core, not invented.

rules:
  # ------------------------------------------------------------------ bronze
  action-setup:
    status: exempt
    comment: >-
      No actions are registered. Remote commands were removed when Jaguar Land
      Rover put device attestation over the endpoints that performed them.
  appropriate-polling: done
  brands:
    status: done
    comment: >-
      Icon and logo, light and dark, at 1x and 2x, in brand/. The exemption
      here used to say a custom integration cannot provide compliant branding;
      that stopped being true when local brand assets became supported, and
      HACS validation now runs the check rather than ignoring it.
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency:
    status: done
    comment: No third-party requirements at all; only what Home Assistant ships.
  docs-actions:
    status: exempt
    comment: No actions.
  docs-conditions:
    status: exempt
    comment: No conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: No triggers.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # ------------------------------------------------------------------ silver
  action-exceptions:
    status: done
    comment: >-
      The refresh button is a platform action, and pressing it when Jaguar
      Land Rover are not answering now raises a translated HomeAssistantError
      rather than returning quietly. Previously exempt on the grounds that
      there are no actions, which read the rule too narrowly.
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable:
    status: done
    comment: >-
      Availability follows the source each entity actually reads from, rather
      than every entity depending on the telemetry socket.
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage:
    status: done
    comment: >-
      98% of the package, and every module at or above the 95% this rule asks
      for — checked per module in CI, not just as an average, because the
      average is the number that hides one module rotting. Run against both
      the oldest supported core and the newest. The config flow is at 100%.

      What is left uncovered is the handful of branches that need a real JLR
      server to reach — a 403 from an edge appliance mid-request, an endpoint
      answering 200 with a body nobody has seen — and each is a log line rather
      than a decision.

  # -------------------------------------------------------------------- gold
  devices: done
  diagnostics: done
  discovery:
    status: exempt
    comment: A cloud account; there is nothing on the network to discover.
  discovery-update-info:
    status: exempt
    comment: As above.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices: done
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default:
    status: done
    comment: >-
      The 12V state of charge, the EVCC connector letter and the charge-now
      override are off by default. All three are either noisy or written for
      one specific consumer, and none is what someone opens the integration
      to look at.
  entity-translations: done
  exception-translations:
    status: done
    comment: >-
      All three failures a person can act on carry a translation key: the
      refresh that could not reach JLR, setup finding no telemetry, and a
      stored sign-in being refused.
  icon-translations: done
  reconfiguration-flow: done
  repair-issues:
    status: done
    comment: Scoped per config entry and removed with it.
  stale-devices: done

  # ---------------------------------------------------------------- platinum
  async-dependency:
    status: done
    comment: Fully async; aiohttp throughout, no blocking client.
  inject-websession:
    status: done
    comment: >-
      The API and telemetry clients take Home Assistant's shared session. The
      sign-in journey and the owner portal need their own cookie jars — the
      journey pins server affinity across several cookies and the portal
      carries a different session cookie to each of two hosts — so those are
      created with async_create_clientsession, which is the helper meant for
      exactly that and hands Home Assistant the lifetime.

      They are released with detach rather than close: the helper builds on
      Home Assistant's shared connector without giving up ownership of it, so
      closing one of these sessions would take that connector down for every
      other integration.
  strict-typing:
    status: done
    comment: >-
      Every setting mypy's --strict turns on is spelled out in pyproject.toml
      rather than inherited from the flag, so switching one off later has to be
      a deliberate and visible decision. CI runs it against a real core with no
      --ignore-missing-imports, which is what makes it mean anything.
