# An honest assessment against Home Assistant's integration quality scale.
#
# This is a custom integration, so nothing here is enforced by hassfest. It is
# kept because writing down what is not done is the only way the list stops
# growing quietly — every "todo" below was found by someone reading the code,
# not by a check.
#
# Rule names are taken from script/hassfest/quality_scale.py in home-assistant
# /core, not invented.

rules:
  # ------------------------------------------------------------------ bronze
  action-setup:
    status: exempt
    comment: >-
      No actions are registered. Remote commands were removed when Jaguar Land
      Rover put device attestation over the endpoints that performed them.
  appropriate-polling: done
  brands:
    status: exempt
    comment: A custom integration cannot be in the home-assistant/brands repo.
  common-modules: done
  config-flow: done
  config-flow-test-coverage:
    status: todo
    comment: >-
      The flow is now tested against a real core — every step, both ways of
      signing in again, and the failure paths that generated the bug reports.
      Not yet the 100% this rule asks for: the options flow and a few error
      branches are still uncovered.
  dependency-transparency:
    status: done
    comment: No third-party requirements at all; only what Home Assistant ships.
  docs-actions:
    status: exempt
    comment: No actions.
  docs-conditions:
    status: exempt
    comment: No conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: todo
  docs-triggers:
    status: exempt
    comment: No triggers.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # ------------------------------------------------------------------ silver
  action-exceptions:
    status: exempt
    comment: No actions.
  config-entry-unloading: done
  docs-configuration-parameters: todo
  docs-installation-parameters: done
  entity-unavailable:
    status: done
    comment: >-
      Availability follows the source each entity actually reads from, rather
      than every entity depending on the telemetry socket.
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage:
    status: todo
    comment: >-
      Line coverage of the package is 86%, enforced as a floor in CI so it
      can only rise, and the suite runs against both the oldest supported core
      and the newest. Covered against a real core: setup, unload and reload,
      repairs, entity creation and availability, diagnostics redaction, both
      config and options flows, and an electric vehicle's entities as well as
      an ICE one's. Covered without one: the reconnect supervisor and its
      backoff, the sign-in journey step by step, the portal's session
      handling, and token rotation.

      Short of the 95% this rule asks for, and the rule wants it per module
      rather than overall. The weakest are telemetry (the socket read loop
      itself, which needs a websocket fake to reach) and portal (its
      interactive sign-in).

  # -------------------------------------------------------------------- gold
  devices: done
  diagnostics: done
  discovery:
    status: exempt
    comment: A cloud account; there is nothing on the network to discover.
  discovery-update-info:
    status: exempt
    comment: As above.
  docs-data-update: todo
  docs-examples: todo
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: todo
  docs-use-cases: todo
  dynamic-devices: done
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default:
    status: done
    comment: >-
      The 12V state of charge, the EVCC connector letter and the charge-now
      override are off by default. All three are either noisy or written for
      one specific consumer, and none is what someone opens the integration
      to look at.
  entity-translations: done
  exception-translations: todo
  icon-translations: done
  reconfiguration-flow: done
  repair-issues:
    status: done
    comment: Scoped per config entry and removed with it.
  stale-devices: done

  # ---------------------------------------------------------------- platinum
  async-dependency:
    status: done
    comment: Fully async; aiohttp throughout, no blocking client.
  inject-websession:
    status: todo
    comment: >-
      The API and telemetry clients take Home Assistant's shared session. The
      portal client deliberately does not: it needs an isolated cookie jar, so
      the sign-in session cannot leak into or be clobbered by other traffic.
  strict-typing: todo
