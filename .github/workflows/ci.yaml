name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

# Nothing here writes to the repository. Actions pinned to commit SHAs rather
# than tags or branches: a tag can be moved and a branch changes under you, so
# @main is an open invitation to run whatever that repository holds tomorrow.
permissions:
  contents: read

env:
  # The oldest core the integration claims to support. Anything using an API
  # newer than this has to raise the claim rather than quietly rely on it.
  MIN_HA_VERSION: "2025.8.0"
  PYTHON_VERSION: "3.13"

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install black isort ruff flake8

      - name: Black
        run: black --check custom_components/ tests/

      - name: isort
        run: isort --check-only custom_components/ tests/

      - name: Ruff
        run: ruff check custom_components/ tests/

      # No --exit-zero. A warning nobody has to act on is not a check, and
      # this ran for months reporting findings that never blocked anything.
      - name: flake8
        run: flake8 custom_components/ tests/

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # The custom-integration test harness rather than a bare core. It
      # brings a matching Home Assistant along with pytest and the warning
      # filters the core's own suite runs under — without those, core's
      # import-time deprecations meet this repo's filterwarnings=error and
      # the run dies during collection. Tests that need a core skip
      # themselves when it is missing, so a lane without one passes while
      # silently running none of them.
      - run: pip install -r requirements-test.txt
      - run: python -m pytest -q

  types:
    name: Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # Against a real Home Assistant: without it every helper is Any and the
      # check passes by knowing nothing.
      - run: pip install mypy homeassistant
      - run: mypy custom_components/jlr_incontrol/ --ignore-missing-imports

  imports:
    name: Imports on Home Assistant ${{ matrix.ha }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both ends of the claim. The minimum is the one that matters: the
        # integration once imported OptionsFlowWithReload while advertising a
        # core a year older than the release that introduced it, and nothing
        # would have caught that until a user on an old core installed it.
        ha: ["2025.8.0", "latest"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Home Assistant
        run: |
          if [ "${{ matrix.ha }}" = "latest" ]; then
            pip install homeassistant
          else
            # With that release's own constraints. Resolving freely gives a
            # dependency set Home Assistant never shipped — the first run of
            # this lane failed on an aiodns/pycares mismatch that has nothing
            # to do with this integration.
            base="https://raw.githubusercontent.com/home-assistant/core"
            # pycares<5 on top: the constraints pin aiodns==3.5.0 but leave
            # pycares free, and pycares 5 removed an attribute that aiodns
            # references at import time. An upstream incompatibility, nothing
            # to do with this integration, but it stops the lane before it can
            # test anything.
            pip install "homeassistant==${{ matrix.ha }}" "pycares<5" \
              -c "$base/${{ matrix.ha }}/homeassistant/package_constraints.txt"
          fi

      - name: Import every module
        run: |
          python - <<'PY'
          import importlib, pkgutil, sys
          sys.path.insert(0, ".")
          package = importlib.import_module("custom_components.jlr_incontrol")
          for module in pkgutil.iter_modules(package.__path__):
              importlib.import_module(
                  f"custom_components.jlr_incontrol.{module.name}"
              )
          print("all modules import")
          PY

      - name: Check the declared minimum matches what is installed
        if: matrix.ha != 'latest'
        run: |
          python - <<'PY'
          import json
          from homeassistant.const import __version__ as installed

          declared = json.load(open("hacs.json"))["homeassistant"]
          assert declared == installed, (
              f"hacs.json claims {declared} but the minimum lane runs {installed}"
          )
          print(f"minimum claim and test lane agree on {declared}")
          PY

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration
          # The integration is not (yet) in the home-assistant/brands repo,
          # which is expected for a custom integration; skip that check.
          ignore: brands

  hassfest:
    name: Hassfest validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: home-assistant/actions/hassfest@a7c616ce81ccda50150bf1595786c71b1883fabb # master
