name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to create (e.g. v1.0.0-beta.5)"
        required: true
      notes:
        description: "Optional notes shown above the changelog (upgrade steps, warnings)"
        required: false

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: get_version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION=${GITHUB_REF#refs/tags/}
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "VERSION_NUMBER=${VERSION#v}" >> $GITHUB_OUTPUT

      - name: Get previous tag
        id: prev_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # The new tag does not exist yet on dispatch runs; the latest tag is the previous release.
            PREV_TAG=$(git describe --abbrev=0 --tags 2>/dev/null || echo "")
          else
            PREV_TAG=$(git describe --abbrev=0 --tags $(git rev-list --tags --skip=1 --max-count=1) 2>/dev/null || echo "")
          fi
          echo "PREV_TAG=$PREV_TAG" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        env:
          PREV_TAG: ${{ steps.prev_tag.outputs.PREV_TAG }}
        run: |
          if [ -n "$PREV_TAG" ]; then
            RANGE="$PREV_TAG..HEAD"
          else
            RANGE="HEAD"
          fi
          CHANGELOG=$(git log $RANGE --pretty=format:"- %s" --no-merges)
          echo "CHANGELOG<<GHEOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "GHEOF" >> $GITHUB_OUTPUT
          # Anything a commit body marked BREAKING: is something a user has to
          # act on. Buried in a commit nobody reads it; it belongs at the top of
          # the release notes.
          BREAKING=$(git log $RANGE --pretty=format:"%b" --no-merges \
            | sed -n 's/^BREAKING: *//p')
          echo "BREAKING<<GHEOF" >> $GITHUB_OUTPUT
          echo "$BREAKING" >> $GITHUB_OUTPUT
          echo "GHEOF" >> $GITHUB_OUTPUT

      - name: Compose release body
        id: body
        env:
          NOTES: ${{ inputs.notes }}
          BREAKING: ${{ steps.changelog.outputs.BREAKING }}
          CHANGELOG: ${{ steps.changelog.outputs.CHANGELOG }}
        run: |
          : > release-body.md
          if [ -n "$NOTES" ]; then
            printf '%s\n\n' "$NOTES" >> release-body.md
          fi
          if [ -n "$BREAKING" ]; then
            printf '## ⚠️ Breaking changes\n\n%s\n\n' "$BREAKING" >> release-body.md
          fi
          printf "## What's Changed\n%s\n\n" "$CHANGELOG" >> release-body.md
          printf '## Installation\n\n' >> release-body.md
          printf '### HACS (recommended)\n' >> release-body.md
          printf 'Add `https://github.com/willbeeching/ha-jlr-incontrol` as a custom repository (category **Integration**), install, and restart Home Assistant.\n\n' >> release-body.md
          printf '### Manual\n' >> release-body.md
          printf 'Download `jlr_incontrol.zip`, extract into `config/custom_components/`, and restart Home Assistant.\n' >> release-body.md

      - name: Create ZIP archive
        run: |
          cd custom_components
          zip -r ../jlr_incontrol.zip jlr_incontrol/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          target_commitish: ${{ github.sha }}
          name: "JLR InControl ${{ steps.get_version.outputs.VERSION }}"
          body_path: release-body.md
          files: jlr_incontrol.zip
          prerelease: ${{ contains(steps.get_version.outputs.VERSION, 'beta') || contains(steps.get_version.outputs.VERSION, 'alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
