version: 2
updates:
  # Only GitHub Actions: the integration has no third-party Python
  # requirements, and its Home Assistant floor is a deliberate decision rather
  # than something to bump automatically.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
    labels:
      - dependencies

  # The pinned lint and test tooling. Pinned so a release cannot fail an
  # unrelated commit; watched so the pins do not quietly rot instead.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
