version: 2
updates:
  # Only GitHub Actions: the integration has no third-party Python
  # requirements, and its Home Assistant floor is a deliberate decision rather
  # than something to bump automatically.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
    labels:
      - dependencies

  # The pinned lint and test tooling. Pinned so a release cannot fail an
  # unrelated commit; watched so the pins do not quietly rot instead.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Both pins in requirements-test-min.txt are the point of that file,
      # and dependabot has proposed undoing each of them once already.
      #
      # The harness pin selects the release carrying the oldest core this
      # integration supports; bumping it tests a newer core twice and the
      # old one never, which the lane then fails on its own assertion.
      - dependency-name: pytest-homeassistant-custom-component
      # And aiodns reads a pycares 5 API that does not exist, so widening
      # this reinstates a break that is already understood.
      - dependency-name: pycares
